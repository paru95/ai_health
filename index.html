<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Nexus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar" id="sidebar">
        <button class="new-chat" onclick="location.reload()">+ New Research</button>
        <div class="history-label">Recent History</div>
        <div id="historyList"></div>
    </div>

    <main class="main-content">
        <div id="welcomeScreen" class="welcome-screen">
            <div class="logo-icon"><i class="fas fa-microscope"></i></div>
            <h1>AI Health Nexus</h1>
            <p>Advanced Clinical Intelligence</p>
        </div>

        <div id="chatWindow" class="chat-window"></div>

        <div class="input-area">
            <div class="search-wrapper">
                <div id="previewBox"></div>
                <div class="input-row">
                    <button class="action-btn" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="file" id="fileInput" hidden onchange="handleFile(event)">
                    
                    <textarea id="userInput" rows="1" placeholder="Search symptoms or research..."></textarea>
                    
                    <button class="action-btn" id="micBtn" onclick="toggleMic()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button class="send-btn" onclick="sendQuery()">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
